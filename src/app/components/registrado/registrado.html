<!-- Aviso de cuenta existente; muestra el correo recibido cuando está disponible. -->
<main class="flex min-h-screen flex-col bg-white px-5 sm:px-10 lg:px-12">
  <header class="pt-8 sm:pt-15">
    <p class="text-center text-3xl font-bold tracking-[0.16em] text-blue-800 uppercase">
      Licitaciones Venezuela
    </p>
  </header>

  <section class="flex flex-1 items-center justify-center py-10 sm:py-14">
    <div class="w-full max-w-xl text-center" role="status" aria-live="polite">
      <div
        class="mx-auto mb-7 flex size-16 items-center justify-center rounded-full bg-blue-100 text-blue-800"
        aria-hidden="true"
      >
        <svg
          class="size-8"
          xmlns="http://www.w3.org/2000/svg"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <circle cx="12" cy="12" r="10" />
          <path d="M12 8v4" />
          <path d="M12 16h.01" />
        </svg>
      </div>

      <h1 class="text-3xl font-bold tracking-tight text-slate-900 sm:text-4xl">
        El usuario ya está registrado
      </h1>
      @if (email) {
        <p class="mt-4 text-base leading-7 text-slate-600 sm:text-lg">
          El correo <span class="font-semibold">{{ email }}</span> ya tiene una cuenta registrada.
        </p>
      } @else {
        <p class="mt-4 text-base leading-7 text-slate-600 sm:text-lg">
          Este usuario ya tiene una cuenta registrada.
        </p>
      }
    </div>
  </section>

  <footer class="border-t border-slate-200 py-5 text-center text-xs leading-5 text-slate-500 sm:text-sm">
    <p>&copy; {{ copyrightYear }} Licitaciones Venezuela. Todos los derechos reservados.</p>
  </footer>
</main>
