<!-- Pantalla 404 que informa de la ruta no disponible y ofrece volver al inicio. -->
<main class="flex min-h-screen flex-col bg-white px-5 sm:px-10 lg:px-12">
  <header class="pt-8 sm:pt-15">
    <p class="text-center text-3xl font-bold tracking-[0.16em] text-blue-800 uppercase">
      Licitaciones Venezuela
    </p>
  </header>

  <section class="flex flex-1 items-center justify-center py-10 sm:py-14">
    <div class="w-full max-w-xl text-center">
      <div
        class="mx-auto mb-7 flex size-16 items-center justify-center rounded-full bg-amber-100 text-amber-700"
        aria-hidden="true"
      >
        <svg
          class="size-8"
          xmlns="http://www.w3.org/2000/svg"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <circle cx="12" cy="12" r="10" />
          <path d="M12 8v4" />
          <path d="M12 16h.01" />
        </svg>
      </div>

      <div role="status" aria-live="polite">
        <p class="text-sm font-semibold tracking-widest text-blue-800 uppercase">Error 404</p>
        <h1 class="mt-2 text-3xl font-bold tracking-tight text-slate-900 sm:text-4xl">
          Esta página no existe
        </h1>
        <p class="mt-4 text-base leading-7 text-slate-600 sm:text-lg">
          El enlace que abriste no corresponde a una página disponible.
        </p>
      </div>

      <a
        class="mt-8 inline-flex items-center justify-center rounded-lg bg-blue-800 px-5 py-3.5 text-sm font-semibold text-white shadow-sm transition hover:bg-blue-900 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-blue-800"
        href="/cargausuario-form"
      >
        Ir al inicio
      </a>
    </div>
  </section>

  <footer class="border-t border-slate-200 py-5 text-center text-xs leading-5 text-slate-500 sm:text-sm">
    <p>&copy; {{ copyrightYear }} Licitaciones Venezuela. Todos los derechos reservados.</p>
  </footer>
</main>
