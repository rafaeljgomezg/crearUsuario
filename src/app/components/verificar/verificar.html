<!-- Muestra los estados de carga, éxito y error durante la verificación de la cuenta. -->
<main class="min-h-screen bg-slate-50 flex items-center justify-center p-4">
  <div class="max-w-md w-full bg-white border border-slate-200 rounded-2xl shadow-xl p-8 text-center">
    @if (cargando) {
      <!-- Muestra el progreso mientras se valida el enlace de verificación. -->
      <div>
        <div class="mx-auto mb-6 flex size-16 items-center justify-center rounded-full bg-blue-100 text-blue-800">
          <div class="size-8 animate-spin rounded-full border-4 border-blue-800 border-t-transparent"></div>
        </div>
        <h1 class="text-2xl font-bold tracking-tight text-slate-900">Verificando tu cuenta...</h1>
        <p class="mt-3 text-sm text-slate-600">Por favor espera un momento mientras activamos tu acceso en Licitaciones Venezuela.</p>
      </div>
    } @else if (exito) {
      <!-- Confirma que la cuenta fue activada y anuncia la redirección al panel. -->
      <div>
        <div class="mx-auto mb-6 flex size-16 items-center justify-center rounded-full bg-emerald-100 text-emerald-800">
          <svg class="size-8" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="m5 12 4 4L19 6"/>
          </svg>
        </div>
        <h1 class="text-2xl font-bold tracking-tight text-slate-900">¡Cuenta verificada con éxito!</h1>
        <p class="mt-3 text-sm text-slate-600">Redirigiéndote a tu panel...</p>
      </div>
    } @else if (error) {
      <!-- Explica por qué no se pudo validar el enlace de la cuenta. -->
      <div>
        <div class="mx-auto mb-6 flex size-16 items-center justify-center rounded-full bg-red-100 text-red-800">
          <svg class="size-8" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/>
          </svg>
        </div>
        <h1 class="text-2xl font-bold tracking-tight text-slate-900">Error de verificación</h1>
        <p class="mt-3 text-sm text-slate-600">{{ mensajeError }}</p>
      </div>
    }
  </div>
</main>
